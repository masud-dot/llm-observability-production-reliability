groups:
- name: slo-alerts-availability
  interval: 1m
  rules:
  - alert: slo_burn_availability_page_1h
    expr: |-
      slo:sli_error:ratio_rate1h{slo="availability"}
        > 0.0144
      and slo:sli_error:ratio_rate5m{slo="availability"}
        > 0.0144
      and slo:sli_error:ratio_rate1h{slo="availability"}
        * slo:valid_events:increase1h{slo="availability"}
        >= 2
    labels:
      severity: page
      slo: availability
      layer: L1
      owner: platform
      window: 1h
  - alert: slo_burn_availability_page_6h
    expr: |-
      slo:sli_error:ratio_rate6h{slo="availability"}
        > 0.006
      and slo:sli_error:ratio_rate30m{slo="availability"}
        > 0.006
      and slo:sli_error:ratio_rate6h{slo="availability"}
        * slo:valid_events:increase6h{slo="availability"}
        >= 2
    labels:
      severity: page
      slo: availability
      layer: L1
      owner: platform
      window: 6h
  - alert: slo_burn_availability_ticket_3d
    expr: |-
      slo:sli_error:ratio_rate3d{slo="availability"}
        > 0.001
      and slo:sli_error:ratio_rate6h{slo="availability"}
        > 0.001
    labels:
      severity: ticket
      slo: availability
      layer: L1
      owner: platform
      window: 3d
