# Frozen technical baseline for the companion repository of
# "LLM Observability & Production AI Reliability".
#
# Frozen and verified: 2026-09-30 (Phase 1.5).
# Rule: no casual upgrades or downgrades. Changing any entry needs
# a full re-verification run and a line in the decision log.
#
# Option B: the OpenTelemetry GenAI semantic conventions are a
# pinned REFERENCE, never a dependency. Every telemetry name lives
# in one compatibility module (src/wrenholt/telemetry/
# conventions.py); drift tests compare it with the commit below.

