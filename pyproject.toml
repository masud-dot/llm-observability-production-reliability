[project]
name = "llm-observability-production-reliability"
version = "0.0.0"
description = "Companion code for LLM Observability & Production AI Reliability (Phase 1.5 frozen baseline)."
requires-python = ">=3.12,<3.15"
license = "MIT"
dependencies = [
    "opentelemetry-api==1.45.0",
    "opentelemetry-sdk==1.45.0",
    "opentelemetry-exporter-otlp-proto-http==1.45.0",
    "opentelemetry-semantic-conventions==0.66b0",
    "opentelemetry-instrumentation-fastapi==0.66b0",
    "opentelemetry-instrumentation-httpx==0.66b0",
    "opentelemetry-instrumentation-logging==0.66b0",
    "fastapi==0.142.1",
    "uvicorn==0.54.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "openai==3.22.1",
    "anthropic==1.9.0",
    "httpx2==2.13.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "hypothesis==6.168.3",
    "mypy==2.3.1",
    "ruff==0.16.9",
]
# Chapter 4 comparison lab only: official instrumentation, pinned
# to the combination verified in the Phase 1 spike.
lab = [
    "opentelemetry-instrumentation-openai-v2==2.4b0",
    "opentelemetry-util-genai==0.4b0",
    "httpx==0.28.1",
]
load = ["locust==2.46.6"]

[tool.uv]
package = false
required-version = "==0.11.7"

[tool.ruff]
line-length = 70
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
strict = true
python_version = "3.12"
