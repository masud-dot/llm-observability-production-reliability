# Prove the local stack end to end: checks 1-8 run in stack-smoke
# and check 9 (a file-provisioned Grafana alert reaching a webhook)
# in alert-smoke. Chapter 3 adds config-lint and checks
# 10-17 for the application plane, including a Collector outage.
name: compose-smoke

on:
  workflow_dispatch:
  push:
    paths:
      - "deploy/compose/**"
      - "services/**"
      - "src/**"
      - "Dockerfile"
      - "pyproject.toml"
      - "uv.lock"
      - "tests/unit/test_config_lint.py"
      - "tests/drift/**"
      - "scripts/smoke_*.py"
      - ".github/workflows/compose-smoke.yml"
  pull_request:
    paths:
      - "deploy/compose/**"
      - "services/**"
      - "src/**"
      - "Dockerfile"
      - "pyproject.toml"
      - "uv.lock"
      - "tests/unit/test_config_lint.py"
      - "tests/drift/**"
      - "scripts/smoke_*.py"
      - ".github/workflows/compose-smoke.yml"

permissions:
  contents: read

env:
  COMPOSE_VERSION: v5.5.1

jobs:
  config-lint:
    name: Config lint (Chapter 3)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Lint rules (pytest, no Docker)
        run: |
          pipx install uv==0.11.7
          uv sync --frozen
          uv run pytest tests/unit/test_config_lint.py

      - name: Collector validates its own config
        run: |
          # The development-only key compose also uses (Chapter 7):
          # redaction refuses an empty HMAC key at validate time.
          # Production sets its own REDACTION_HMAC_KEY.
          docker run --rm \
            -e TEMPO_OTLP_HTTP=http://tempo:4318 \
            -e PROM_OTLP_HTTP=http://prometheus:9090/api/v1/otlp \
            -e LOKI_OTLP_HTTP=http://loki:3100/otlp \
            -e REDACTION_HMAC_KEY=dev-only-redaction-key-not-for-production \
            -v "$PWD/deploy/compose/otelcol:/cfg:ro" \
            ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.162.0-amd64 \
            validate --config=/cfg/config.yaml

      - name: promtool checks the Prometheus config
        run: |
          docker run --rm --entrypoint promtool \
            -v "$PWD/deploy/compose/prometheus:/cfg:ro" \
            prom/prometheus:v3.15.0 check config /cfg/prometheus.yml

      - name: Drift suite against the pinned GenAI commit (Chapter 5)
        run: |
          docker create --name prom prom/prometheus:v3.15.0
          docker cp prom:/bin/promtool "$RUNNER_TEMP/promtool"
          docker rm prom
          GENAI=open-telemetry/semantic-conventions-genai
          git clone -q --filter=blob:none \
            "https://github.com/$GENAI" "$RUNNER_TEMP/genai"
          git -C "$RUNNER_TEMP/genai" checkout -q \
            bcc7f9c2856fa7f4feb753f54d4ebba9455cc3dc
          PATH="$RUNNER_TEMP:$PATH" \
            SEMCONV_GENAI_DIR="$RUNNER_TEMP/genai" \
            uv run pytest tests/drift

  stack-smoke:
    name: Stack smoke (checks 1-8, 10-17)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install pinned Docker Compose
        run: |
          mkdir -p "$HOME/.docker/cli-plugins"
          curl -fsSL -o "$HOME/.docker/cli-plugins/docker-compose" \
            "https://github.com/docker/compose/releases/download/${COMPOSE_VERSION}/docker-compose-linux-x86_64"
          chmod +x "$HOME/.docker/cli-plugins/docker-compose"
          docker version
          docker compose version

      - name: Validate Compose model
        working-directory: deploy/compose
        run: docker compose config --quiet

      - name: "Check 1: start stack (containers running, app healthy)"
        working-directory: deploy/compose
        run: docker compose up --detach --build --wait --wait-timeout 240

      - name: "Checks 1-7: smoke test"
        run: python3 scripts/smoke_stack.py

      - name: "Checks 10-15 and 18: application plane"
        run: python3 scripts/smoke_wrenholt.py

      - name: "Check 16: Linnet keeps serving without a Collector"
        run: |
          docker compose -f deploy/compose/docker-compose.yml \
            stop otel-collector
          python3 scripts/smoke_wrenholt.py --collector-down

      - name: "Check 17: telemetry resumes after recovery"
        run: |
          docker compose -f deploy/compose/docker-compose.yml \
            start otel-collector
          python3 scripts/smoke_wrenholt.py --collector-recovered

      - name: Dump logs on failure
        if: failure()
        working-directory: deploy/compose
        run: docker compose logs --no-color --timestamps

      - name: "Check 8: shut down cleanly"
        if: always()
        working-directory: deploy/compose
        run: |
          docker compose down --volumes --remove-orphans --timeout 60
          test -z "$(docker compose ps --all --quiet)"

  alert-smoke:
    name: Alert smoke (check 9)
    needs: stack-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.alerting.yml
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install pinned Docker Compose
        run: |
          mkdir -p "$HOME/.docker/cli-plugins"
          curl -fsSL -o "$HOME/.docker/cli-plugins/docker-compose" \
            "https://github.com/docker/compose/releases/download/${COMPOSE_VERSION}/docker-compose-linux-x86_64"
          chmod +x "$HOME/.docker/cli-plugins/docker-compose"

      - name: Start stack with alerting overlay
        working-directory: deploy/compose
        run: docker compose up --detach --build --wait --wait-timeout 240

      - name: "Check 9: provisioned alert reaches webhook"
        run: python3 scripts/smoke_alert.py

      - name: Dump logs on failure
        if: failure()
        working-directory: deploy/compose
        run: docker compose logs --no-color --timestamps grafana webhook-sink

      - name: Shut down cleanly
        if: always()
        working-directory: deploy/compose
        run: |
          docker compose down --volumes --remove-orphans --timeout 60
          test -z "$(docker compose ps --all --quiet)"
