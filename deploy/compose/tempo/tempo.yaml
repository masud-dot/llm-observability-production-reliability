# Tempo v3.1.0 in monolithic mode: all components in-process,
# no Kafka (Tempo 3.0 release notes). Based on the v3.1.0
# example/docker-compose/single-binary configuration.
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: info

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: "0.0.0.0:4318"

storage:
  trace:
    backend: local
    wal:
      path: /tmp/tempo/wal
    local:
      path: /tmp/tempo/blocks

# Appendix A: traces are kept 14 days, as the privacy contract says
# (Chapter 7). This is Tempo's default; set here so a new default
# cannot change it unseen.
backend_scheduler:
  provider:
    compaction:
      compaction:
        block_retention: 336h
backend_worker:
  compaction:
    block_retention: 336h

usage_report:
  reporting_enabled: false
