# Local stack. Telemetry plane (Phase 1.5): OpenTelemetry
# Collector, Prometheus, Tempo, Loki, Grafana; Jaeger is the
# documented alternative only (Appendix H). Application plane
# (Chapter 3): Linnet API, mock providers A and B, orders service.
name: llmobs-smoke

services:
  otel-collector:
    image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.162.0-amd64
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otelcol/config.yaml:/etc/otelcol/config.yaml:ro
    environment:
      TEMPO_OTLP_HTTP: http://tempo:4318
      PROM_OTLP_HTTP: http://prometheus:9090/api/v1/otlp
      LOKI_OTLP_HTTP: http://loki:3100/otlp
      # Development only; production injects a secret (Chapter 7).
      REDACTION_HMAC_KEY: ${REDACTION_HMAC_KEY:-dev-only-redaction-key-not-for-production}
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8888:8888"
      - "13133:13133"
    depends_on: [tempo, loki, prometheus]

  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-otlp-receiver
      # Exemplars link metrics to traces (Chapter 6).
      - --enable-feature=exemplar-storage
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  tempo:
    image: grafana/tempo:3.1.0
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    # Tempo 3.1.0 needed ~30 s to stop in the Phase 1.5 native run
    # (backend worker waits out a job timeout); allow it to exit.
    stop_grace_period: 60s
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
    ports:
      - "3200:3200"

  loki:
    image: grafana/loki:3.7.8
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./loki/loki.yaml:/etc/loki/loki.yaml:ro
    ports:
      - "3100:3100"

  grafana:
    image: grafana/grafana:13.2.3
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: smoke-only-password
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on: [prometheus, tempo, loki]

  smoke-app:
    build: ../../services/smoke_app
    environment:
      OTEL_SERVICE_NAME: smoke-app
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_METRIC_EXPORT_INTERVAL: "2000"
    ports:
      - "8000:8000"
    depends_on: [otel-collector]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u; u.urlopen('http://localhost:8000/healthz', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 24

  # ---- Application plane (Chapter 3): one image, four services.
  # No service here depends on the telemetry plane: Linnet must
  # start, and keep serving, without a Collector.
  linnet-api:
    build: &app-image
      context: ../..
      dockerfile: Dockerfile
    command: ["uvicorn", "wrenholt.api.main:app",
              "--host", "0.0.0.0", "--port", "8000"]
    environment:
      WRENHOLT_PROVIDER_URL: http://mock-provider-a:8100/v1
      OTEL_SERVICE_NAME: linnet-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      # Seconds: the Python exporter reads this number in seconds,
      # though the specification says milliseconds. It bounds every
      # export, so a dead Collector cannot stall shutdown.
      OTEL_EXPORTER_OTLP_TIMEOUT: "2"
      OTEL_METRIC_EXPORT_INTERVAL: "5000"
    ports:
      - "8080:8000"
    depends_on:
      mock-provider-a:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "services.healthcheck", "8000"]
      interval: 5s
      timeout: 3s
      retries: 24

  mock-provider-a:
    build: *app-image
    command: ["uvicorn", "services.mock_llm.main:app",
              "--host", "0.0.0.0", "--port", "8100"]
    environment:
      MOCK_LLM_PROVIDER: a
    ports:
      - "8101:8100"
    healthcheck: &provider-health
      test: ["CMD", "python", "-m", "services.healthcheck", "8100"]
      interval: 5s
      timeout: 3s
      retries: 24

  mock-provider-b:
    build: *app-image
    command: ["uvicorn", "services.mock_llm.main:app",
              "--host", "0.0.0.0", "--port", "8100"]
    environment:
      MOCK_LLM_PROVIDER: b
    ports:
      - "8102:8100"
    healthcheck: *provider-health

  orders:
    build: *app-image
    command: ["uvicorn", "services.orders.main:app",
              "--host", "0.0.0.0", "--port", "8200"]
    environment:
      OTEL_SERVICE_NAME: orders
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_TIMEOUT: "2"
    ports:
      - "8200:8200"
    healthcheck:
      test: ["CMD", "python", "-m", "services.healthcheck", "8200"]
      interval: 5s
      timeout: 3s
      retries: 24
