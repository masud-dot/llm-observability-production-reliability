# OpenTelemetry Collector (contrib v0.162.0), Phase 1.5 smoke.
# Only Stable/Beta components; exporters take endpoints from env.
extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 400
    spike_limit_mib: 100
  batch:
    timeout: 1s
  # Chapter 7, defence in depth: services redact before export; this
  # catches what one without that code would send. Beta for traces,
  # Alpha for logs at this version.
  redaction:
    allow_all_keys: true
    blocked_values:
      - "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}"
      - "\\+\\d{1,3}(?:[ -]?\\d){7,12}"
      - "WG-\\d{6}"
    hash_function: hmac-sha256
    hmac_key: ${env:REDACTION_HMAC_KEY}
    summary: info

exporters:
  otlphttp/tempo:
    endpoint: ${env:TEMPO_OTLP_HTTP}
  otlphttp/prometheus:
    endpoint: ${env:PROM_OTLP_HTTP}
  otlphttp/loki:
    endpoint: ${env:LOKI_OTLP_HTTP}

service:
  extensions: [health_check]
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, redaction, batch]
      exporters: [otlphttp/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, redaction, batch]
      exporters: [otlphttp/loki]
