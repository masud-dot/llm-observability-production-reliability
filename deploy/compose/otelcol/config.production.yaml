# OpenTelemetry Collector (contrib v0.162.0), production-like
# profile (Chapter 10): the development pipeline, plus tail sampling
# for traces and export queues sized on purpose. One Collector sees
# every span of a trace; loadbalancing.yaml shows the tier in front
# of several. Planning figure: 40 answers a second at a sale-day
# peak. Each answer is two traces, the request's and its
# reproduction bundle's (Chapter 6), and 15 spans on FS-09's
# normal-hour mix (measured in Chapter 10's native run).
extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 400
    spike_limit_mib: 100
  redaction:
    allow_all_keys: true
    blocked_values:
      - "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}"
      - "\\+\\d{1,3}(?:[ -]?\\d){7,12}"
      - "WG-\\d{6}"
    hash_function: hmac-sha256
    hmac_key: ${env:REDACTION_HMAC_KEY}
    summary: info
  tail_sampling:
    # The 10 s request deadline and the SDK's 5 s export delay: every
    # span of an answer that keeps its deadline is in before the
    # decision.
    decision_wait: 20s
    # 80 new traces a second at the peak, 1,600 in one decision wait:
    # room for three times that before a trace is dropped undecided.
    num_traces: 5000
    expected_new_traces_per_sec: 80
    decision_cache:
      # 20 minutes of keep decisions at the peak, for late spans.
      sampled_cache_size: 100000
    policies:
      - name: errors
        type: status_code
        status_code:
          status_codes: [ERROR]
      # A failed attempt is an error span (Chapter 4), so retried
      # requests are kept by errors.
      - name: slow-first-chunk  # the ttfc SLI's 2.5 s (Chapter 2)
        type: ottl_condition
        ottl_condition:
          error_mode: ignore
          span:
            - >-
              span.attributes["gen_ai.response.time_to_first_chunk"]
              >= 2.5
      - name: slow  # past the 10 s request deadline
        type: latency
        latency:
          threshold_ms: 10000
      - name: loop-stopped
        type: string_attribute
        string_attribute:
          key: wrenholt.agent.stop_reason
          values: [repeated_call, step_limit]
      - name: replayed-write
        type: boolean_attribute
        boolean_attribute:
          key: wrenholt.tool.replayed
          value: true
      - name: model-mismatch
        type: boolean_attribute
        boolean_attribute:
          key: wrenholt.gateway.model_mismatch
          value: true
      - name: baseline  # one trace in ten of everything else
        type: probabilistic
        probabilistic:
          sampling_percentage: 10
  batch:
    timeout: 1s

exporters:
  # Queues count spans, points or records (sizer: items). Traces: a
  # minute of the peak even if every trace were kept. Logs: two
  # minutes of the peak at two records an answer. Metrics: five
  # minutes of one instance's budgeted points, exported every 5 s;
  # they are cumulative, so the export after a loss restores the
  # totals. What does not fit is dropped and counted in
  # otelcol_exporter_enqueue_failed_*.
  otlp_http/tempo:
    endpoint: ${env:TEMPO_OTLP_HTTP}
    sending_queue:
      sizer: items
      queue_size: 36000
  otlp_http/prometheus:
    endpoint: ${env:PROM_OTLP_HTTP}
    sending_queue:
      sizer: items
      queue_size: 12000
  otlp_http/loki:
    endpoint: ${env:LOKI_OTLP_HTTP}
    sending_queue:
      sizer: items
      queue_size: 10000

service:
  extensions: [health_check]
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, redaction, tail_sampling, batch]
      exporters: [otlp_http/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, redaction, batch]
      exporters: [otlp_http/loki]
