# Prometheus v3.15.0. Application metrics arrive over OTLP
# (--web.enable-otlp-receiver); the Collector's own metrics are
# scraped so pipeline losses are visible.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Chapter 12: the SLO recording rules, generated from the SLO file.
# A 28-day window needs more than the default 15 days of samples.
rule_files:
  - rules/slo.rules.yaml
storage:
  tsdb:
    retention:
      time: 35d

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]
