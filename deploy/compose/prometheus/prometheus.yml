# Prometheus v3.15.0. Application metrics arrive over OTLP
# (--web.enable-otlp-receiver); the Collector's own metrics are
# scraped so pipeline losses are visible.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]
