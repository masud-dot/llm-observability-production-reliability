  - record: slo:sli_error:ratio_rate3d
    expr: (sum(rate(wrenholt_slo_events_total{wrenholt_slo_sli="availability",wrenholt_slo_good="false"}[3d])) or vector(0)) / (sum(rate(wrenholt_slo_events_total{wrenholt_slo_sli="availability"}[3d])) > 0)
    labels:
      slo: availability
      sli: availability
      layer: L1
  - record: slo:sli_error:ratio_rate28d
    expr: (sum(rate(wrenholt_slo_events_total{wrenholt_slo_sli="availability",wrenholt_slo_good="false"}[28d])) or vector(0)) / (sum(rate(wrenholt_slo_events_total{wrenholt_slo_sli="availability"}[28d])) > 0)
    labels:
