# Generated from src/wrenholt/slo/objectives.yaml by
# scripts/slo_rules.py. Do not edit by hand.
groups:
- name: slo-availability
  interval: 1m
  rules:
  - record: slo:sli_error:ratio_rate5m
    expr: (sum(rate(wrenholt_slo_events_total{wrenholt_slo_sli="availability",wrenholt_slo_good="false"}[5m])) or vector(0)) / (sum(rate(wrenholt_slo_events_total{wrenholt_slo_sli="availability"}[5m])) > 0)
    labels:
      slo: availability
      sli: availability
      layer: L1
  - record: slo:sli_error:ratio_rate30m
