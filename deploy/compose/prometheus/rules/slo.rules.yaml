    labels:
      slo: availability
      sli: availability
      layer: L1
  - record: slo:sli_error:ratio_rate6h
    expr: (sum(rate(wrenholt_slo_events_total{wrenholt_slo_sli="availability",wrenholt_slo_good="false"}[6h])) or vector(0)) / (sum(rate(wrenholt_slo_events_total{wrenholt_slo_sli="availability"}[6h])) > 0)
