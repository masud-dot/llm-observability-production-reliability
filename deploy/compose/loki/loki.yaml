# Loki v3.7.8, single process, filesystem storage. Based on
# cmd/loki/loki-local-config.yaml at v3.7.8. OTLP logs arrive at
# /otlp/v1/logs; service.name becomes the service_name label.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info

common:
  instance_addr: 127.0.0.1
  path_prefix: /tmp/loki
  storage:
    filesystem:
      chunks_directory: /tmp/loki/chunks
      rules_directory: /tmp/loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: true
  # Appendix A: logs are operational or identifier data, kept 14 days
  # as the privacy contract says (Chapter 7).
  retention_period: 336h

compactor:
  working_directory: /tmp/loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
